[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum1d"
version = "0.1.0"
description = "Motor de referencia 1D de Schrodinger dependiente del tiempo (split-step de Strang)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum1d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
